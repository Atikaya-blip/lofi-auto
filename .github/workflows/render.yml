name: Lofi Video Renderer

on:
  workflow_dispatch:
    inputs:
      audio_file:
        description: "Path of the licensed track in the repo"
        default: "music/track1.mp3"
      video_id:
        description: "ID from your Sheet"
        default: "TEST1"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Render lofi video with Pomodoro timer
        env:
          AUDIO: ${{ inputs.audio_file }}
          VID: ${{ inputs.video_id }}
        run: |
          mkdir -p output
          ffmpeg -y \
            -stream_loop -1 -i assets/loop.mp4 \
            -i "$AUDIO" \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{eif\:floor((1500-mod(t,1500))/60)\:d\:2}\:%{eif\:mod(1500-mod(t,1500),60)\:d\:2}':fontcolor=white:fontsize=96:x=(w-text_w)/2:y=(h-text_h)/2" \
            -map 0:v -map 1:a -shortest \
            -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k \
            -movflags +faststart "output/${VID}.mp4"

      - name: Save rendered video
        uses: actions/upload-artifact@v4
        with:
          name: lofi-${{ inputs.video_id }}
          path: output/${{ inputs.video_id }}.mp4
          retention-days: 7
