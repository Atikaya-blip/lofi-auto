name: Lofi Video Renderer

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Title shown on the video"
        default: "Lofi Study Session"
      video_id:
        description: "Name for the output file"
        default: "TEST2"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Join all tracks into one playlist
        run: |
          mkdir -p output
          for f in music/*.mp3; do echo "file '$PWD/$f'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt -c:a libmp3lame -b:a 192k output/mix.mp3

      - name: Render video
        env:
          TITLE: ${{ inputs.title }}
          VID: ${{ inputs.video_id }}
        run: |
          printf '%s' "$TITLE" > title.txt
          ffmpeg -y \
            -f lavfi -i "gradients=s=1280x720:c0=0x1b1b3a:c1=0x693668:c2=0xa74482:nb_colors=3:speed=0.08:r=30" \
            -i output/mix.mp3 \
            -vf "hue=h=8*t,noise=alls=8:allf=t,vignette=PI/4,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=title.txt:fontcolor=white:fontsize=56:x=(w-text_w)/2:y=150+10*sin(t):alpha=0.85,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{eif\:floor((1500-mod(t,1500))/60)\:d\:2}\:%{eif\:mod(1500-mod(t,1500),60)\:d\:2}':fontcolor=white:fontsize=96:x=(w-text_w)/2:y=(h-text_h)/2" \
            -map 0:v -map 1:a -shortest \
            -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k \
            -movflags +faststart "output/${VID}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: lofi-${{ inputs.video_id }}
          path: output/${{ inputs.video_id }}.mp4
          retention-days: 7
