name: GTA 6 Clip Transcribe

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Sheet row ID (for example TEST-001)"
        required: true
      source_url:
        description: "Direct download link to the APPROVED source video"
        required: true
      permission:
        description: "Permission status from the Sheet (must be APPROVED)"
        required: true
        default: "PENDING"
      model:
        description: "Whisper model: tiny, base or small"
        required: true
        default: "base"

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Stop unless the source is APPROVED
        env:
          PERMISSION: ${{ inputs.permission }}
        run: |
          if [ "$PERMISSION" != "APPROVED" ]; then
            echo "Source permission is '$PERMISSION', not APPROVED. Stopping."
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake build-essential

      - name: Download the approved source file
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p work output
          curl -L --fail --retry 3 -o work/source.bin "$SOURCE_URL"
          ls -lh work/source.bin
          if ! ffprobe -v error -show_entries format=duration -of default=nw=1 work/source.bin; then
            echo "The downloaded file is not a readable video."
            echo "Check that the link is a direct download and the file is shared with 'Anyone with the link'."
            exit 1
          fi

      - name: Extract 16 kHz mono audio
        run: ffmpeg -y -i work/source.bin -vn -ac 1 -ar 16000 work/audio.wav

      - name: Restore whisper.cpp cache
        id: cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp
          key: whisper-cpp-v1-${{ inputs.model }}

      - name: Build whisper.cpp and download the model
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MODEL: ${{ inputs.model }}
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          sh ./models/download-ggml-model.sh "$MODEL"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --config Release

      - name: Transcribe with word timestamps
        env:
          MODEL: ${{ inputs.model }}
        run: |
          ./whisper.cpp/build/bin/whisper-cli \
            -m "whisper.cpp/models/ggml-$MODEL.bin" \
            -f work/audio.wav \
            -l auto -ml 1 -sow -oj -of output/transcript
          ls -lh output
          head -c 1500 output/transcript.json

      - name: Save transcript
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ inputs.row_id }}
          path: output/transcript.json
          retention-days: 7
