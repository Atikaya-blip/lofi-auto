name: GTA 6 Clip Transcribe

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Sheet row ID (for example TEST-001)"
        required: true
      source_url:
        description: "Direct download link to the APPROVED source video"
        required: true
      permission:
        description: "Permission status from the Sheet (must be APPROVED)"
        required: true
        default: "PENDING"
      start_seconds:
        description: "Where the clip starts, in seconds (for example 95)"
        required: true
        default: "0"
      length_seconds:
        description: "Clip length in seconds (20 to 60)"
        required: true
        default: "30"
      language:
        description: "Spoken language: auto, en or hi"
        required: true
        default: "auto"

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Stop unless the source is APPROVED
        env:
          PERMISSION: ${{ inputs.permission }}
        run: |
          if [ "$PERMISSION" != "APPROVED" ]; then
            echo "Source permission is '$PERMISSION', not APPROVED. Stopping."
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake build-essential fonts-noto-core

      - name: Download the approved source file
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p work output
          curl -L --fail --retry 3 -o work/source.bin "$SOURCE_URL"
          if ! ffprobe -v error -show_entries format=duration -of default=nw=1 work/source.bin; then
            echo "The downloaded file is not a readable video."
            exit 1
          fi

      - name: Cut the clip
        env:
          START: ${{ inputs.start_seconds }}
          LENGTH: ${{ inputs.length_seconds }}
        run: |
          ffmpeg -y -ss "$START" -i work/source.bin -t "$LENGTH" \
            -c:v libx264 -preset veryfast -crf 18 -c:a aac work/clip.mp4

      - name: Extract audio for captions
        run: ffmpeg -y -i work/clip.mp4 -vn -ac 1 -ar 16000 work/audio.wav

      - name: Restore whisper.cpp cache
        id: cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp
          key: whisper-cpp-v1-base

      - name: Build whisper.cpp and download the model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          sh ./models/download-ggml-model.sh base
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --config Release

      - name: Make captions
        env:
          LANG_CODE: ${{ inputs.language }}
        run: |
          ./whisper.cpp/build/bin/whisper-cli \
            -m whisper.cpp/models/ggml-base.bin \
            -f work/audio.wav \
            -l "$LANG_CODE" -ml 24 -sow -osrt -of output/captions
          cat output/captions.srt | head -n 30

      - name: Make vertical video with captions
        env:
          ROW_ID: ${{ inputs.row_id }}
        run: |
          STYLE="FontName=Noto Sans,Bold=1,FontSize=72,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=5,Shadow=0,Alignment=2,MarginV=520"
          ffmpeg -y -i work/clip.mp4 -filter_complex \
            "[0:v]split[a][b];[a]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=30:5[bg];[b]scale=1080:-2[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2,subtitles=output/captions.srt:original_size=1080x1920:force_style='${STYLE}'[out]" \
            -map "[out]" -map 0:a? \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 128k -movflags +faststart \
            "output/short-${ROW_ID}.mp4"
          ls -lh output

      - name: Save the Short
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.row_id }}
          path: output/short-${{ inputs.row_id }}.mp4
          retention-days: 7
